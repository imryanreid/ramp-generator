<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Color Ramp &amp; Semantics Generator</title>
    <meta
      name="description"
      content="Pick one brand color and get a complete design system: perceptually-even OKLCH ramps, derived accents, a matched neutral, status colors, and usage-first semantic tokens for light and dark. Export to CSS, Tailwind v4, Figma variables, or JSON."
    />
    <link rel="canonical" href="https://www.ramps.studio/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ryan Reid" />
    <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />

    <!--
      Raster first, SVG second: browsers that understand `type` take the SVG
      and scale it perfectly, while everything else falls back to the PNG.
      The PNG is not redundant — Google Search's favicon docs list neither SVG
      among the supported formats nor anything at or below 48x48 as advisable,
      and the SVG declares an intrinsic 32x32. Without a raster fallback a
      search result gets the generic globe.
      All three are generated from one shape by scripts/build-icons.py.
    -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social unfurls -->
    <meta property="og:type" content="website" />
    <!--
      og:site_name is the brand; og:title matches the <title> exactly. The two
      are deliberately different — an unfurl shows both, so repeating the same
      words twice wastes the card. The value proposition lives in
      og:description below rather than in a title tail, which would collide
      with "Semantics Generator" saying much the same thing.
      Note "&amp;" here but a bare "&" in the JSON-LD block: attribute values
      are HTML-parsed, the contents of a ld+json script are not.
    -->
    <meta property="og:site_name" content="Ramps Studio" />
    <meta property="og:url" content="https://www.ramps.studio/" />
    <meta property="og:title" content="Color Ramp &amp; Semantics Generator" />
    <meta
      property="og:description"
      content="Pick one brand color and get a complete design system: OKLCH ramps, derived accents, a matched neutral, status colors, and semantic tokens for light and dark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://www.ramps.studio/api/og" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Color Ramp Generator — perceptually-even OKLCH color ramps"
    />
    <meta name="twitter:image" content="https://www.ramps.studio/api/og" />
    <meta name="twitter:title" content="Color Ramp &amp; Semantics Generator" />
    <meta
      name="twitter:description"
      content="Pick one brand color and get a complete design system, ready to export as CSS, Tailwind, Figma variables, or JSON."
    />

    <!--
      Structured data. Describes the tool to search engines and to agents that
      parse the page without executing JavaScript. `potentialAction` documents
      the URL API so an agent can construct a palette request directly.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Color Ramp & Semantics Generator",
        "url": "https://www.ramps.studio/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Generates a complete design-system color palette from a single brand color: perceptually-even OKLCH ramps (50-950), scheme-derived accents, a chroma-matched neutral, collision-avoided status colors, and usage-first semantic tokens for light and dark themes with enforced WCAG AA or AAA contrast. Exports to CSS custom properties, a Tailwind v4 theme block, W3C DTCG token files for Figma variables, or JSON.",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Ryan Reid",
          "url": "https://www.linkedin.com/in/imryanreid/"
        },
        "featureList": [
          "Perceptually-even OKLCH ramps at 11 steps (50-950)",
          "Accent derivation by color scheme: complementary, analogous, triadic, split-complementary, monochromatic",
          "Chroma-matched neutral ramp tinted toward the brand hue",
          "Status colors (success, warning, error, info) with hue-collision avoidance",
          "Usage-first semantic tokens mapped for light and dark themes",
          "Enforced WCAG AA (4.5:1) or AAA (7:1) contrast — token steps are adjusted automatically to meet the selected level, not merely flagged",
          "Export to CSS custom properties, a Tailwind v4 theme block, W3C DTCG tokens for Figma variables, or JSON",
          "A copyable prompt that hands the palette to a coding agent",
          "Per-ramp and per-token selection — deselected rows are omitted from every export and from the machine-readable block",
          "Shareable permalinks that encode the full palette in the URL"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.ramps.studio/?b={brand_hex_without_hash}&m={scope}&s={scheme}&c={wcag_level}&xr={excluded_ramps}&xt={excluded_tokens}"
          },
          "query-input": [
            "required name=brand_hex_without_hash",
            "required name=scope",
            "required name=scheme",
            "required name=wcag_level",
            "name=excluded_ramps",
            "name=excluded_tokens"
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
