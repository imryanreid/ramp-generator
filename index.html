<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ramps · Color ramps and semantic tokens your agent can read</title>
    <meta
      name="description"
      content="The color ramp generator built for handing off: every palette is readable by an agent as plain text or JSON, with no JavaScript. Perceptually-even OKLCH ramps, derived accents, a matched neutral, status colors, and usage-first semantic tokens for light and dark, with WCAG AA or AAA enforced rather than merely reported. Export to CSS, Tailwind v4, Figma variables, or JSON."
    />
    <link rel="canonical" href="https://www.ramps.studio/" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Ryan Reid" />
    <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />

    <!--
      Raster first, SVG second: browsers that understand `type` take the SVG
      and scale it perfectly, while everything else falls back to the PNG.
      The PNG is not redundant — Google Search's favicon docs list neither SVG
      among the supported formats nor anything at or below 48x48 as advisable,
      and the SVG declares an intrinsic 32x32. Without a raster fallback a
      search result gets the generic globe.
      All three are generated from one shape by scripts/build-icons.py.
    -->
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Social unfurls -->
    <meta property="og:type" content="website" />
    <!--
      og:site_name is the brand; og:title matches the <title> exactly.

      The title leads with the tool name so a browser tab identifies itself
      before it truncates — "Ramps · Color ramps and…" — and so the family
      reads as a set across open tabs. The tool name rather than the domain:
      Motion has no domain yet, and a scheme the whole family cannot use
      consistently is not a scheme. It also spends seven fewer characters of a
      title budget Google measures in pixels.

      The title used to be "Color Ramp & Semantics Generator", which competed
      head-on with every generator that has fifteen years of authority on that
      phrase, and said nothing about the one thing none of them do. It now
      leads with what is actually differentiated. The agent claim is not
      marketing: robots.txt addresses agents directly, /llms.txt is the full
      contract, and the page renders its palette as plain text with no
      JavaScript — all of which is testable from a terminal.
      Note "&amp;" here but a bare "&" in the JSON-LD block: attribute values
      are HTML-parsed, the contents of a ld+json script are not.
    -->
    <meta property="og:site_name" content="Ramps Studio" />
    <meta property="og:url" content="https://www.ramps.studio/" />
    <meta
      property="og:title"
      content="Ramps · Color ramps and semantic tokens your agent can read"
    />
    <meta
      property="og:description"
      content="Built for handing off: every palette is readable by an agent as plain text or JSON, with no JavaScript. OKLCH ramps, derived accents, status colors, and semantic tokens for light and dark."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:image" content="https://www.ramps.studio/api/og" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Color Ramp Generator — perceptually-even OKLCH color ramps"
    />
    <meta name="twitter:image" content="https://www.ramps.studio/api/og" />
    <meta
      name="twitter:title"
      content="Ramps · Color ramps and semantic tokens your agent can read"
    />
    <meta
      name="twitter:description"
      content="Built for handing off: readable by an agent as plain text or JSON, with no JavaScript. Export to CSS, Tailwind, Figma variables, or JSON."
    />

    <!--
      Structured data. Describes the tool to search engines and to agents that
      parse the page without executing JavaScript. `potentialAction` documents
      the URL API so an agent can construct a palette request directly.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ramps Studio",
        "url": "https://www.ramps.studio/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any (web browser)",
        "description": "Built to be handed to a coding agent: the homepage returns a complete palette as plain text without JavaScript, /api/palette returns it as JSON, and /llms.txt documents every parameter and token name. Generates a complete design-system color palette from a single brand color: perceptually-even OKLCH ramps (50-950), scheme-derived accents, a chroma-matched neutral, collision-avoided status colors, and usage-first semantic tokens for light and dark themes with enforced WCAG AA or AAA contrast. Exports to CSS custom properties, a Tailwind v4 theme block, W3C DTCG token files for Figma variables, or JSON.",
        "isAccessibleForFree": true,
        "isPartOf": {
          "@type": "WebSite",
          "name": "Studio Tools",
          "description": "Small, free, agent-readable design utilities."
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": {
          "@type": "Person",
          "name": "Ryan Reid",
          "url": "https://www.linkedin.com/in/imryanreid/"
        },
        "featureList": [
          "Perceptually-even OKLCH ramps at 11 steps (50-950)",
          "Accent derivation by color scheme: complementary, analogous, triadic, split-complementary, monochromatic",
          "Chroma-matched neutral ramp tinted toward the brand hue",
          "Status colors (success, warning, error, info) with hue-collision avoidance",
          "Usage-first semantic tokens mapped for light and dark themes",
          "Enforced WCAG AA (4.5:1) or AAA (7:1) contrast — token steps are adjusted automatically to meet the selected level, not merely flagged",
          "Export to CSS custom properties, a Tailwind v4 theme block, W3C DTCG tokens for Figma variables, or JSON",
          "A copyable prompt that hands the palette to a coding agent",
          "Per-ramp and per-token selection — deselected rows are omitted from every export and from the machine-readable block",
          "Shareable permalinks that encode the full palette in the URL"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://www.ramps.studio/?b={brand_hex_without_hash}&a={accent_hex_without_hash}&a2={tertiary_accent_hex_without_hash}&m={scope}&s={scheme}&c={wcag_level}&f={notation}&xr={excluded_ramps}&xt={excluded_tokens}"
          },
          "query-input": [
            "required name=brand_hex_without_hash",
            "name=accent_hex_without_hash",
            "name=tertiary_accent_hex_without_hash",
            "name=scope",
            "name=scheme",
            "name=wcag_level",
            "name=notation",
            "name=excluded_ramps",
            "name=excluded_tokens"
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
